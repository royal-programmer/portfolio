# Keeps the free-tier Supabase project from auto-pausing (7 days of inactivity)
# and, if it has paused anyway, restores it via the Management API.
# A failed run = GitHub emails the repo owner.
#
# Setup: see portfolio-site/supabase/README.md → "Keep-alive & backups".
# Note: scheduled workflows only run from the default branch (main).
name: supabase-keepalive

on:
  schedule:
    - cron: "17 6 */2 * *" # every 2nd day, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Ensure Supabase is awake
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash .github/scripts/supabase-ensure-awake.sh
